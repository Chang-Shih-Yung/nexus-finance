# Client CI — lint + typecheck + build
#
# Validates that the Next.js frontend compiles without errors.
# Runs on push to main or PRs when client code changes.

name: Client CI

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/ci-client.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/ci-client.yml'

jobs:
  client-ci:
    name: Lint → Typecheck → Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
