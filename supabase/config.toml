# Nexus Finance — Supabase local / CI configuration.
# Only used by `supabase start`. Does NOT affect your remote instance.

project_id = "nexus-finance"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[db.migrations]
# Disabled so CI can bootstrap extensions before applying migrations.
# Migrations are applied manually via psql in the CI workflow.
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = false

[storage]
enabled = false

[auth]
enabled = false
site_url = "http://127.0.0.1:3000"

[edge_runtime]
enabled = false
policy = "per_worker"

[analytics]
enabled = false
port = 54327
backend = "postgres"
