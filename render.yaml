services:
  - type: web
    name: nexus-finance-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: pnpm install --frozen-lockfile
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false   # 在 Render dashboard 手動填入 Neon 連線字串
      - key: GEMINI_API_KEY
        sync: false   # 在 Render dashboard 手動填入
      - key: JWT_SECRET
        sync: false   # 產生方式：openssl rand -base64 32
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false   # 填入 Vercel 部署後的網址，例如 https://nexus-finance.vercel.app
